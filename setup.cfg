[aliases]
test = pytest

[metadata]
description-file = README.md



[tool:pytest]
testpaths = tests
pythonpath = .
# Always list the names of failed tests in the summary
addopts = -rf
markers =
    slow: tests that take more than about a second (deselect with -m "not slow")
    gpu: tests that require a CUDA GPU and cupy

[coverage:run]
source = quflow
omit =
    quflow/experimental/*
    quflow/templates/*

[coverage:report]
show_missing = true
skip_covered = false
